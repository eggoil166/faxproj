[system]
type=system
timer_t1=1000
timer_b=64000

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[fax-endpoint](!)
type=endpoint
context=torfax-inbound
disallow=all
allow=ulaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=no
fax_detect=no
direct_media=no

[self](fax-endpoint)
aors=self
[self]
type=aor
contact=sip:127.0.0.1:5060
[self]
type=identify
endpoint=self
match=127.0.0.1

[hub](fax-endpoint)
aors=hub
[hub]
type=aor
contact=sip:10.73.0.1:5060
[hub]
type=identify
endpoint=hub
match=10.73.0.1

[vm](fax-endpoint)
aors=vm
[vm]
type=aor
contact=sip:10.73.0.2:5060
[vm]
type=identify
endpoint=vm
match=10.73.0.2
