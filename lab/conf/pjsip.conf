[transport-lo]
type=transport
protocol=udp
bind=127.0.0.1:5060

[fax-endpoint](!)
type=endpoint
context=torfax-inbound
disallow=all
allow=ulaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=no
fax_detect=no
direct_media=no

[self](fax-endpoint)
aors=self

[self]
type=aor
contact=sip:127.0.0.1:5060

[self]
type=identify
endpoint=self
match=127.0.0.1
